name: build
on: [push, pull_request]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: cmd
        run: build.cmd
      - name: Test
        shell: cmd
        run: test.cmd
      - name: Translations
        shell: powershell
        run: .\tools\check-lang.ps1
